<script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const menuLinks = document.querySelectorAll('.menu a');

        menuLinks.forEach(link => {
            const linkPath = link.pathname;
            if (currentPath.startsWith(linkPath) && linkPath !== '/') {
                link.classList.add('current');
            } else if (currentPath === '/' && linkPath === '/') {
                link.classList.add('current');
            }
        });
    });
</script> 
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const galleryItems = document.querySelectorAll('.gallery-item');
        const modal = document.getElementById('lightbox-modal');
        const modalImage = document.getElementById('lightbox-image');
        const modalCaption = document.getElementById('lightbox-caption');
        const closeModalButton = document.getElementById('close-modal');
    
        // --- 1. OPEN MODAL ---
        galleryItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault(); // Stop the link from navigating away!
    
                // Get image source and alt text from the clicked item
                const imgSrc = item.getAttribute('href'); 
                const imgAlt = item.querySelector('img').getAttribute('alt');
                
                // Extract the caption from the overlay (using the new span class)
                const titleElement = item.querySelector('.image-title');
                const descElement = item.querySelector('.image-description');
                
                const captionHTML = `
                    <h4>${titleElement ? titleElement.textContent : 'Image Title'}</h4>
                    <p>${descElement ? descElement.textContent : ''}</p>
                `;
    
                // Populate the modal
                modalImage.src = imgSrc;
                modalImage.alt = imgAlt; 
                modalCaption.innerHTML = captionHTML;
    
                // Show the modal and make it accessible
                modal.classList.add('is-open'); 
                modal.setAttribute('aria-hidden', 'false');
                
                // Set focus to the close button for keyboard users
                closeModalButton.focus(); 
            });
        });
    
        // --- 2. CLOSE MODAL ---
        function closeModal() {
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
            // Restore focus to the last element that opened the modal (if possible)
            // For simplicity, we'll just remove the focus for now.
        }
    
        // Close button listener
        closeModalButton.addEventListener('click', closeModal);
    
        // Close on ESC key press
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('is-open')) {
                closeModal();
            }
        });
    
        // Close on click outside the modal content
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    });
</script>
<div id="lightbox-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
