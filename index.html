<script>
    // --- Helper Function ---
    // A helper function to wait for a condition to be met
    function waitUntil(test, interval, callback) {
        if (test()) {
            callback();
        } else {
            setTimeout(() => waitUntil(test, interval, callback), interval);
        }
    }

    // --- Core JSPaint Loader Function ---
    // Loads a specified image URL into the jspaint iframe.
    function loadImageIntoJSPaint(imageURL) {
        // Get the iframe and its content window inside the function
        const iframe = document.getElementById("jspaint-iframe");
        const jspaint = iframe.contentWindow;

        // Wait for the iframe's systemHooks to be ready
        waitUntil(() => jspaint.systemHooks, 500, () => {
            // 1. Define the custom file reading hook (your existing logic)
            jspaint.systemHooks.readBlobFromHandle = async (file_handle) => {
                try {
                    const response = await fetch(file_handle);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.blob();
                } catch (error) {
                    console.error("Failed to read blob from handle:", error);
                    return null;
                }
            };

            // 2. Load the image using the provided URL (imageURL)
            jspaint.systemHooks.readBlobFromHandle(imageURL).then(file => {
                if (file) {
                    // Use true for the second argument to prevent showing a confirmation dialog
                    jspaint.open_from_file(file, imageURL, true); 
                } else {
                    jspaint.show_error_message(`Failed to open file ${imageURL}`);
                }
            }).catch(error => {
                jspaint.show_error_message(`Failed to open file ${imageURL}`, error);
            });
        });
    }

    // --- Screen Size Handler ---
    let currentImage = null; // Variable to store the currently loaded image URL

    function handleScreenSize() {
        const screenWidth = window.innerWidth;
        let imageToLoad;

        // Define your breakpoints and corresponding image paths
        if (screenWidth >= 2000) {
            imageToLoad = "jane bio 4k.png"; 
        } else if (screenWidth >= 1200) {
            imageToLoad = "jane bio ipad.png";
        } else if (screenWidth >= 768) {
            imageToLoad = "jane bio ipad.png";
        } else {
            // Default for screens smaller than 768px
            imageToLoad = "jane about me mobile.png";
        }

        // Only load the image if the required image is different from the current one
        if (imageToLoad !== currentImage) {
            currentImage = imageToLoad;
            loadImageIntoJSPaint(imageToLoad);
        }
    }

    // --- Event Listeners ---
    
    // Call the function on initial page load
    window.addEventListener('load', handleScreenSize);

    // Call the function when the window is resized.
    // Use debouncing (setTimeout) to prevent excessive function calls during resizing.
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(handleScreenSize, 200); // Wait 200ms after resizing stops
    });
</script>
