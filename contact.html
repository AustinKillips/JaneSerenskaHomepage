<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="styles.css">
    <title>Contact - Jane Serenska</title>

    <style>
        /* CSS to replace the <br> tags for vertical spacing */
        .form-group {
            /* Adds space below each form element container */
            margin-bottom: 12px; 
            display: block; /* Ensures each group takes a new line */
        }
        
        .form-group label {
            /* Optional: Ensures the label is on its own line */
            display: block; 
            margin-bottom: 4px; /* Space between label and input */
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            /* Ensures inputs and textarea take full width of their container */
            width: 100%; 
            box-sizing: border-box; /* Includes padding and border in the element's total width */
        }
    </style>

</head>
<body>
        <header>
        <div class="logo">
            <a href="index.html">
            <img src="assets/jane logo.png" alt="a clickable wordmark logo that reads 'Jane Serenska' with drawn images of bobby pins and a hand putting eyeshadow on to the right of the tex">
        </a>
        </div>
        <nav class="menu">
            <ul>
                <li style="border-right: 0px;"><a href="portfolio.html">Portfolio</a></li>
                <li style="border-right: 0px;"><a href="Gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>    

        <h1 class="contact-title">
    <picture>
        <img src="assets/header images/contact title.gif" alt="a gif of a 'blinkie' style button with the words 'Say Hello!' written in bubbly text abutted by sparkling stars">
    </picture>
        </h1>
    <div class="contact-field-border-disabled" style="padding: 20px">
        <form action="https://api.web3forms.com/submit" method="POST" id="form">
            <fieldset>
                <legend>Contact Form</legend>
                <input type="hidden" name="access_key" value="d8338cdd-a2d8-4b5d-859b-d3a87848cecd" />
                <input type="hidden" name="subject" value="New Submission from Web3Forms" />
                <input type="hidden" name="redirect" value="https://web3forms.com/success" />
                <input type="checkbox" name="botcheck" id="" style="display: none;" />
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="whatever you like to be called" required />
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="your-email@website.com" required />
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" name="phone" id="phone" placeholder="cell, landline, or pager" required />
                </div>
                
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea rows="5" name="message" id="message" placeholder="Write your message here" required></textarea>
                </div>
            
                <button type="submit"> Send Message </button>
            </fieldset>
        </form>
    </div>
</main>

<footer>
    <div class="footer-top">
        <div class="footer-box footer-return-box">
            <a href="#" aria-label="Return to the top of the page">Return to Top</a>
        </div>
        <div class="footer-box footer-home-box">
            <a href="index.html" aria-label="Return to the homepage">Homepage</a>
        </div>
      
    </div>
    <div class="footer-middle">
        <div class="footer-box footer-ig-box">
            <a href="https://www.instagram.com/sweetbbjane/?hl=en" aria-label="Link to Jane's Instagram"> Instagram</a>
        </div>
        <div class="footer-box footer-imdb-box">
            <a href="https://www.imdb.com/name/nm12645938/" aria-label="Link to Jane's IMDB">IMDB</a>
        </div>
        <div class="footer-box footer-contact-box">
            <a href="https://janeserenska.com/contact" aria-label="Open page to contact Jane">Contact</a>            
        </div>
    </div>
    <div class="footer-bottom">
        <p>2025 Jane Serenska | All Rights Reserved.</p>
    </div>
</footer>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const menuLinks = document.querySelectorAll('.menu a');

    menuLinks.forEach(link => {
        const linkPath = link.pathname;
        if (currentPath.startsWith(linkPath) && linkPath !== '/') {
            link.classList.add('current');
        } else if (currentPath === '/' && linkPath === '/') {
            link.classList.add('current');
        }
    });
});
</script>
</body>
</html>
