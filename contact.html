<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <title>Contact - Jane Serenska</title>
</head>
<body>
        <header>
        <div class="logo">
            <a href="index.html">
            <img src="jane logo 2.png" alt="Company Logo">
        </a>
        </div>
        <nav class="menu">
            <ul>
                <li style="border-right: 0px;"><a href="portfolio.html">Portfolio</a></li>
                <li style="border-right: 0px;"><a href="Gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="contact-field-border-disabled" style="padding: 20px">

    <div class="contact-title">
        <picture>
        <img src="say-hello 300.gif" alt="">
    </picture>
    </div>
    <div class="corner-triangle corner-triangle-top-left"></div>
    <div class="corner-triangle corner-triangle-top-right"></div>
    <div class="corner-triangle corner-triangle-bottom-left"></div>
    <div class="corner-triangle corner-triangle-bottom-right"></div>
    <form action="https://api.web3forms.com/submit" method="POST" id="form">
        <fieldset>
          <legend>Contact Form</legend>
          <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE" />
          <input type="hidden" name="subject" value="New Submission from Web3Forms" />
          <input type="hidden" name="redirect" value="https://web3forms.com/success" />
          <input type="checkbox" name="botcheck" id="" style="display: none;" />
          <div>
            <label for="name"> Name</label><br class="labels">
            <input type="text" name="name" id="name" placeholder="whatever you like to be called!" required />
            <br><br>
          </div>
          <div>
            <label for="email">Email Address</label><br>
            <input type="email" name="email" id="email" placeholder="your-email@website.com" required /><br><br>
          </div>
          <div>
            <label for="phone">Phone Number</label>
            <br>
            <input type="text" name="phone" id="phone" placeholder="cell, landline, or pager" required /><br><br>
          </div>
          <div>
            <label for="message">Your Message</label>
            <br>
            <textarea rows="5" name="message" id="message" placeholder="Write your message here!" required></textarea><br><br>
          </div>
      
          <button type="submit"> Send Message </button>
        </fieldset>
      </form>
    </main>
</div>
    <footer>
        <div class="footer-top">
            <div class="footer-box footer-return-box">
                <a href="#">Return to Top</a>
            </div>
            <div class="footer-box footer-home-box">

            </div>
          
        </div>
        <div class="footer-middle">
            <div class="footer-box footer-ig-box">

            </div>
                <div class="footer-box-imdb">
                    <a href="https://www.imdb.com/name/nm12645938/">IMDB</a>
                </div>
          <div class="footer-box footer-contact-box">
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>2025 Jane Serenska | All Rights Reserved.</p>
        </div>
    </footer>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const menuLinks = document.querySelectorAll('.menu a');

        menuLinks.forEach(link => {
            const linkPath = link.pathname;
            if (currentPath.startsWith(linkPath) && linkPath !== '/') {
                link.classList.add('current');
            } else if (currentPath === '/' && linkPath === '/') {
                link.classList.add('current');
            }
        });
    });
</script>
</body>
</html>
